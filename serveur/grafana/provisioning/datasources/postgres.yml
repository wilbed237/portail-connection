apiVersion: 1
datasources:
  - name: GANDAL
    uid: gandal-pg
    type: grafana-postgresql-datasource
    url: db:5432
    user: grafana_ro
    isDefault: true
    editable: false
    jsonData:
      database: gandal
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
